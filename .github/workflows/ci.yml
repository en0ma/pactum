name: protocol-ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "Run only the checks needed for the current task"
        required: true
        type: choice
        default: discovery
        options:
          - discovery
          - dflow-quote
          - architecture
          - evidence
          - full

permissions:
  contents: read

concurrency:
  group: pactum-ci-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  ANCHOR_VERSION: "1.1.2"
  SOLANA_VERSION: "3.1.10"
  PACTUM_BYTECODE_BUDGET_BYTES: "600000"

jobs:
  build:
    if: ${{ false }}
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Solana/Agave
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --force
          rustup toolchain install 1.91.0 --profile minimal
          RUSTUP_TOOLCHAIN=1.91.0 avm install ${ANCHOR_VERSION} --from-source
          avm use ${ANCHOR_VERSION}
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Generate ephemeral program key and sync
        run: |
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --silent -o target/deploy/pactum_vault-keypair.json
          anchor keys sync

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust unit and property tests
        run: cargo test --workspace

      - name: JavaScript unit tests
        run: npm install --no-audit --no-fund && npm run test:js

      - name: Build production program
        run: |
          set -o pipefail
          anchor build 2>&1 | tee /tmp/pactum-anchor-production.log
          if grep -q "Stack offset of .* exceeded max offset" /tmp/pactum-anchor-production.log; then
            echo "SBF stack frame exceeded runtime limit"
            exit 1
          fi

      - name: Enforce program bytecode budget
        run: |
          size_bytes="$(stat -c%s target/deploy/pactum_vault.so)"
          echo "pactum_vault.so: ${size_bytes} bytes (budget: ${PACTUM_BYTECODE_BUDGET_BYTES})"
          test "${size_bytes}" -le "${PACTUM_BYTECODE_BUDGET_BYTES}"

      - name: Build fork test hooks
        run: |
          set -o pipefail
          anchor build -- --features test-hooks 2>&1 | tee /tmp/pactum-anchor-test-hooks.log
          if grep -q "Stack offset of .* exceeded max offset" /tmp/pactum-anchor-test-hooks.log; then
            echo "SBF stack frame exceeded runtime limit"
            exit 1
          fi

  dflow-wrapper-rust:
    if: ${{ github.event_name == 'pull_request' }}
    name: DFlow on-chain read-only guard compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check vault program
        run: cargo check -p pactum-vault --lib
      - name: Test vault-scoped keeper authorization
        run: cargo test -p pactum-vault --lib vault_keeper_authorization_tests

  dflow-sdk-offline:
    if: ${{ github.event_name == 'pull_request' }}
    name: DFlow offline SDK composition tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test transaction composition and guards
        run: node --test tests/dflow-compose.test.mjs

  dflow-quote-inspection:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'dflow-quote') }}
    name: DFlow unsigned quote inspection (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DFLOW_API_KEY: ${{ secrets.DFLOW_API_KEY }}
      DFLOW_PROBE_OUTPUT_MINT: ${{ vars.DFLOW_PROBE_OUTPUT_MINT }}
      DFLOW_PROBE_USER: ${{ vars.DFLOW_PROBE_USER }}
      DFLOW_EXPECTED_VAULT_AUTHORITY: ${{ vars.DFLOW_EXPECTED_VAULT_AUTHORITY }}
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Solana transaction decoder
        run: npm install --no-audit --no-fund
      - name: Probe DFlow unsigned quote and inspect accounts
        run: node scripts/probe-dflow-quote-inspection.mjs
      - name: Compare DFlow default and PDA recipients
        run: node scripts/compare-dflow-recipient-signers.mjs
      - name: Upload DFlow quote inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dflow-quote-inspection
          path: |
            artifacts/dflow-quote-inspection.json
            artifacts/dflow-recipient-signer-comparison.json
          if-no-files-found: warn
          retention-days: 14

  dflow-connectivity:
    if: ${{ github.event_name == 'pull_request' }}
    name: DFlow public API connectivity (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check DFlow DNS, HTTP, and runner country
        run: node scripts/probe-dflow-connectivity.mjs
      - name: Upload DFlow connectivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dflow-connectivity
          path: artifacts/dflow-network-connectivity.json
          if-no-files-found: warn
          retention-days: 7

  dflow-evidence:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'evidence' || inputs.scope == 'full')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    name: DFlow evidence (${{ matrix.window }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - window: recent
            start_before: ""
            scan_after: "2026-09-01T00:00:00Z"
            scan_before: "2026-10-07T00:00:00Z"
          - window: summer
            start_before: ""
            scan_after: "2026-07-01T00:00:00Z"
            scan_before: "2026-09-01T00:00:00Z"
          - window: june
            start_before: "5SvpxZ2G5vGq76epubFM4VmM6ZF9kFm5fTJ5WQvhX6GpEG2Q4vtv6JdUnc8SkRDyPrC8TPfoqHHn82NgVqnahGBx"
            scan_after: "2026-06-01T00:00:00Z"
            scan_before: "2026-07-01T00:00:00Z"
          - window: may
            start_before: "5fJ6d48HuUfzjjpf7kwVKb8Z4R5bnLNAywriVH2VcwWWLvrbLbeuzqDLw7mjG7oPbknAjgK5z3Gs5XUdUSZYTjZW"
            scan_after: "2026-05-01T00:00:00Z"
            scan_before: "2026-06-01T00:00:00Z"

    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Collect DFlow mainnet evidence
        env:
          DFLOW_DATASET_SAMPLE_LIMIT: "25"
          DFLOW_DATASET_PROGRAM_SIGNATURE_PAGE: "1000"
          DFLOW_DATASET_PROGRAM_SCAN_LIMIT: "12000"
          DFLOW_DATASET_START_BEFORE_SIGNATURE: ${{ matrix.start_before }}
          DFLOW_DATASET_SCAN_AFTER: ${{ matrix.scan_after }}
          DFLOW_DATASET_SCAN_BEFORE: ${{ matrix.scan_before }}
          DFLOW_DATASET_TX_LIMIT_PER_ORDER: "6"
          DFLOW_DATASET_MAX_RUNTIME_MS: "360000"
          DFLOW_DATASET_INSTRUCTION_EXAMPLE_LIMIT: "1000"
          DFLOW_DATASET_OUTPUT: artifacts/dflow-mainnet-${{ matrix.window }}.json
        run: node scripts/collect-dflow-mainnet.mjs

      - name: Upload DFlow mainnet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dflow-mainnet-${{ matrix.window }}
          path: artifacts/dflow-mainnet-${{ matrix.window }}.json
          if-no-files-found: warn
          retention-days: 14


  dflow-market-discovery:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'discovery' || inputs.scope == 'full')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    name: DFlow active-market discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set rolling 200-hour observation window
        run: |
          echo "DFLOW_DATASET_SCAN_AFTER=$(date -u -d '200 hours ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "DFLOW_DATASET_SCAN_BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Collect today's confirmed DFlow instructions
        env:
          DFLOW_DATASET_SAMPLE_LIMIT: "10"
          DFLOW_DATASET_PROGRAM_SIGNATURE_PAGE: "500"
          DFLOW_DATASET_PROGRAM_SCAN_LIMIT: "6000"
          DFLOW_DATASET_TX_LIMIT_PER_ORDER: "4"
          DFLOW_DATASET_MAX_RUNTIME_MS: "150000"
          DFLOW_DATASET_INSTRUCTION_EXAMPLE_LIMIT: "1000"
          DFLOW_DATASET_OUTPUT: artifacts/dflow-mainnet-recent.json
        run: node scripts/collect-dflow-mainnet.mjs
      - name: Check active-market candidates
        run: node scripts/discover-dflow-open-markets.mjs
      - name: Check USDC-input open readiness
        run: node scripts/preflight-dflow-open.mjs
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dflow-open-market-candidates
          path: |
            artifacts/dflow-open-market-candidates.json
            artifacts/dflow-open-preflight.json
            artifacts/dflow-mainnet-recent.json
          if-no-files-found: warn
          retention-days: 14

  dflow-cpi-evidence:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'architecture' || inputs.scope == 'full')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    name: DFlow CPI architecture evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
      PACTUM_DFLOW_OPEN_PROBE_CU_BUDGET: "140000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          components: rustfmt

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Solana/Agave
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --force
          rustup toolchain install 1.91.0 --profile minimal
          RUSTUP_TOOLCHAIN=1.91.0 avm install ${ANCHOR_VERSION} --from-source
          avm use ${ANCHOR_VERSION}
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Install Surfpool
        run: |
          curl -sL https://run.surfpool.run/ | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Run DFlow CPI architecture probe
        run: bash scripts/run-fork-ci.sh

  mainnet-fork:
    if: ${{ false }}
    name: Mainnet fork / DFlow CPI / CU budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: build

    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
      PACTUM_NOOP_CU_BUDGET: "12000"
      PACTUM_DFLOW_PROBE_CU_BUDGET: "80000"
      PACTUM_DFLOW_PDA_PROBE_CU_BUDGET: "80000"
      PACTUM_BASE_FEE_BUDGET_LAMPORTS: "10000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Solana/Agave
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --force
          rustup toolchain install 1.91.0 --profile minimal
          RUSTUP_TOOLCHAIN=1.91.0 avm install ${ANCHOR_VERSION} --from-source
          avm use ${ANCHOR_VERSION}
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Install Surfpool
        run: |
          curl -sL https://run.surfpool.run/ | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run fork tests
        run: bash scripts/run-fork-ci.sh
