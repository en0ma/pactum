[package]
name = "pactum-vault"
version = "0.1.0"
description = "Pactum non-custodial prediction-market vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pactum_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
test-hooks = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = "=1.1.2"
solana-cpi = "3"
solana-instruction = "3"
solana-instructions-sysvar = "3"
solana-pubkey = "3"

[dev-dependencies]
proptest = "=1.6.0"
