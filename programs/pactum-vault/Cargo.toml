[package]
name = "pactum-vault"
version = "0.1.0"
description = "Pactum non-custodial prediction-market vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pactum_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
test-hooks = []

[dependencies]
anchor-lang = "1.1.2"
solana-cpi = "3"
solana-instruction = "3"
solana-pubkey = "3"
